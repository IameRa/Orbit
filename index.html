<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0720'/><circle cx='32' cy='32' r='22' fill='none' stroke='%23d9ccff' stroke-width='3'/><circle cx='32' cy='32' r='9' fill='%238b6cff'/><circle cx='47.6' cy='16.4' r='6' fill='%23ffd23f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2eefc;--dim:#a79ccf;--gold:#ffd23f;--mint:#8ffbe0;--glass:rgba(255,255,255,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0a0720;color:var(--ink);font-family:Figtree,"Avenir Next",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:14px;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:0 16px;pointer-events:none}
.pill{display:inline-block;background:var(--glass);border-radius:999px;padding:5px 14px;font-size:.9rem;color:var(--dim);backdrop-filter:blur(6px)}
.pill b{color:var(--ink);font-family:Unbounded,system-ui,sans-serif;font-weight:500}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#sc{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:2.4rem;line-height:1;text-shadow:0 0 22px rgba(160,140,255,.7)}
#combo{font-size:.85rem;font-weight:600;color:#10122b;background:var(--mint);border-radius:999px;padding:3px 12px;box-shadow:0 0 16px rgba(143,251,224,.6);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
#combo.on{opacity:1;transform:scale(1)}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;pointer-events:none;background:radial-gradient(ellipse at center,rgba(10,7,32,.78),rgba(10,7,32,.4) 70%)}
#msg h1{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,9vw,3.6rem);margin:0;letter-spacing:.04em;text-shadow:0 0 30px rgba(160,140,255,.8)}
#msg p{margin:0;color:var(--dim);max-width:34ch;line-height:1.5}
.legend{display:flex;gap:18px;color:var(--dim);font-size:.9rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
button{pointer-events:auto;font:inherit;font-weight:600;background:var(--gold);color:#1a1040;border:0;border-radius:999px;padding:13px 34px;cursor:pointer;box-shadow:0 0 26px rgba(255,210,63,.45)}
#snd{background:var(--glass);color:var(--dim);box-shadow:none;padding:5px 14px;font-size:.85rem;font-weight:400}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Orbit Spielfeld"></canvas>
<div id="hud">
 <div><span class="pill">Level <b id="lv">1</b></span></div>
 <div id="mid"><b id="sc">0</b><span id="combo"></span></div>
 <div class="r"><span class="pill">Rekord <b id="hi">0</b></span><button id="snd">Ton an</button></div>
</div>
<div id="msg"><h1>Orbit</h1><p>Tippe, klicke oder drücke die Leertaste, um die Bahn zu wechseln.</p>
<div class="legend"><span><i style="background:#8ffbe0"></i>Stern</span><span><i style="background:#8ab4ff"></i>Schutz</span><span><i style="background:#ff7a4d"></i>Meiden</span></div>
<button id="go">Start</button><p style="font-size:.85rem;opacity:.7">P = Pause · M = Ton</p></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const sc=$('sc'),lv=$('lv'),hi=$('hi'),cb=$('combo'),msg=$('msg'),snb=$('snd');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,S,cx,cy,MR,R=[0,0],best=0,muted=false,ac,hue=255,clk=0;
try{best=+localStorage.getItem('orbit-best')||0;muted=localStorage.getItem('orbit-mute')==='1'}catch(e){}
hi.textContent=best;snb.textContent=muted?'Ton aus':'Ton an';
function snd(f,d=.09,type='sine',v=.07){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
function toggleMute(){muted=!muted;snb.textContent=muted?'Ton aus':'Ton an';try{localStorage.setItem('orbit-mute',muted?'1':'0')}catch(e){}}
snb.onclick=e=>{e.stopPropagation();toggleMute()};
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);cx=W/2;cy=H/2;MR=Math.hypot(W,H)/2;R=[S*.22,S*.38]}
addEventListener('resize',resize);resize();
let p,ents,parts,score,level,combo,comboT,shield,shake,t,spawn,speed,running=false,paused=false,last=0;
function reset(){p={a:-Math.PI/2,ring:0,r:R[0]};ents=[];parts=[];score=0;level=1;combo=0;comboT=0;shield=false;shake=0;t=0;spawn=0;speed=1.5;sc.textContent=0;lv.textContent=1;cb.className='';setBg()}
function setBg(){hue=(255+(level-1)*30)%360;document.body.style.background='radial-gradient(ellipse at 50% 45%,hsl('+hue+',55%,17%),hsl('+hue+',65%,5%) 75%)'}
function pos(a,r){return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*130;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,max:.9,c,s:2+Math.random()*3})}}
function flip(){if(!running||paused)return;p.ring=1-p.ring;snd(p.ring?330:260,.05,'triangle',.04)}
function start(){reset();running=true;paused=false;msg.style.display='none';last=performance.now();snd(440,.1)}
function pause(){if(!running||paused)return;paused=true;msg.innerHTML='<h1>Pause</h1><button id="go">Weiter</button>';msg.style.display='flex';$('go').onclick=resume}
function resume(){paused=false;msg.style.display='none';last=performance.now()}
function end(){running=false;shake=.4;snd(110,.4,'sawtooth',.09);const nb=score>best&&score>0;if(score>best){best=score;hi.textContent=best;try{localStorage.setItem('orbit-best',best)}catch(e){}}
cb.className='';msg.innerHTML='<h1>'+score+' Punkte</h1><p>Level '+level+(nb?' · Neuer Rekord!':' · Rekord: '+best)+'</p><button id="go">Nochmal</button>';msg.style.display='flex';$('go').onclick=start}
$('go').onclick=start;
addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')flip()});
addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();if(running)flip();else if(msg.style.display!=='none')start()}
 else if(e.code==='KeyP'||e.code==='Escape'){paused?resume():pause()}
 else if(e.code==='KeyM')toggleMute()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function gain(n){score+=n;sc.textContent=score;const l=1+Math.floor(score/12);if(l>level){level=l;lv.textContent=l;setBg();snd(660,.2,'square',.05)}}
function step(dt){
 t+=dt;speed=1.5+Math.min(t*.025,1.2)+(level-1)*.06;
 p.a+=speed*dt;p.r+=(R[p.ring]-p.r)*Math.min(1,dt*14);
 if(combo>0){comboT-=dt;if(comboT<=0){combo=0;cb.className=''}}
 spawn-=dt;
 if(spawn<=0){spawn=Math.max(.42,1.1-t*.01-(level-1)*.03);
  const r=Math.random(),ring=Math.random()<.5?0:1;
  const k=r<.55?'bad':(r<.62&&!shield&&!ents.some(e=>e.k==='shield'))?'shield':'star';
  const a=p.a+Math.PI*(.7+Math.random()*.6);
  const clash=k==='bad'&&ents.some(e=>e.k==='bad'&&e.ring!==ring&&Math.abs(Math.atan2(Math.sin(e.a-a),Math.cos(e.a-a)))<1.1);
  if(!clash)ents.push({a,ring,k,v:k==='bad'?-.7:0,life:k==='bad'?9:6,age:0,pts:Array.from({length:8},()=>.72+Math.random()*.45),rot:Math.random()*6})}
 const[px,py]=pos(p.a,p.r);
 for(let i=ents.length-1;i>=0;i--){const e=ents[i];e.a+=e.v*dt;e.age+=dt;
  const[ex,ey]=pos(e.a,R[e.ring]);
  if(Math.hypot(px-ex,py-ey)<S*.032){
   if(e.k==='bad'){ents.splice(i,1);burst(ex,ey,'#ff7a4d',20);
    if(shield){shield=false;shake=.25;snd(180,.2,'square',.07);continue}
    end();return}
   if(e.k==='shield'){shield=true;burst(ex,ey,'#8ab4ff',14);snd(784,.18,'triangle',.07)}
   else{combo=Math.min(5,combo+1);comboT=2.5;cb.textContent='Combo x'+combo;cb.className='on';gain(combo);burst(ex,ey,'#8ffbe0',10);snd(520+combo*60,.09)}
   ents.splice(i,1);continue}
  if(e.age>e.life)ents.splice(i,1)}
 if(shake>0)shake-=dt;
}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b}
function noglow(){ctx.shadowBlur=0}
function draw(dt){
 clk+=dt;
 ctx.clearRect(0,0,W,H);ctx.save();
 if(shake>0&&!RM)ctx.translate((Math.random()-.5)*40*shake,(Math.random()-.5)*40*shake);
 const tt=RM?0:clk;
 ctx.globalCompositeOperation='lighter';
 for(let i=0;i<3;i++){const ph=tt*(.07+i*.03)+i*2.1,bx=cx+Math.cos(ph)*W*.35,by=cy+Math.sin(ph*1.3+i)*H*.3,br=MR*(.5+.12*Math.sin(tt*.4+i)),hh=(hue+i*40)%360;
  const gg=ctx.createRadialGradient(bx,by,0,bx,by,br);gg.addColorStop(0,'hsla('+hh+',80%,55%,.16)');gg.addColorStop(1,'hsla('+hh+',80%,55%,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H)}
 ctx.globalCompositeOperation='source-over';
 ctx.lineWidth=2;
 for(let i=0;i<4;i++){const f=(tt*.18+i/4)%1;ctx.strokeStyle='hsla('+hue+',80%,75%,'+(.16*(1-f))+')';ctx.beginPath();ctx.arc(cx,cy,S*.07+f*MR*.95,0,7);ctx.stroke()}
 R.forEach((r,i)=>{const on=p&&running&&p.ring===i;
  ctx.lineWidth=S*.06;ctx.strokeStyle='hsla('+hue+',70%,70%,'+(on?.13:.07)+')';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  glow('hsl('+hue+',90%,70%)',on?14:8);ctx.lineWidth=on?3:2.5;ctx.strokeStyle='hsla('+hue+',80%,84%,'+(on?.95:.7)+')';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();noglow()});
 if(p&&running){ctx.lineWidth=3;ctx.lineCap='round';for(let k=0;k<12;k++){ctx.strokeStyle='rgba(255,210,63,'+(.5*(1-k/12))+')';ctx.beginPath();ctx.arc(cx,cy,R[p.ring],p.a-(k+1)*.1,p.a-k*.1);ctx.stroke()}}
 const pr=S*.075*(1+.02*Math.sin(clk*2)),g=ctx.createRadialGradient(cx-pr*.3,cy-pr*.35,pr*.1,cx,cy,pr);
 g.addColorStop(0,'hsl('+hue+',85%,78%)');g.addColorStop(1,'hsl('+(hue+35)+',70%,26%)');
 glow('hsl('+hue+',90%,62%)',44);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,pr,0,7);ctx.fill();noglow();
 for(const e of ents){const[x,y]=pos(e.a,R[e.ring]);ctx.globalAlpha=Math.min(1,(e.life-e.age)*2,e.age*4+.3);
  if(e.k==='bad'){ctx.beginPath();for(let i=0;i<8;i++){const an=i*Math.PI/4+e.rot+e.age*1.5,rd=S*.028*e.pts[i];ctx[i?'lineTo':'moveTo'](x+Math.cos(an)*rd,y+Math.sin(an)*rd)}ctx.closePath();
   glow('#ff5a2d',14);ctx.fillStyle='#ff7a4d';ctx.fill();noglow();ctx.strokeStyle='#ffb08a';ctx.lineWidth=1.5;ctx.stroke()}
  else if(e.k==='shield'){glow('#8ab4ff',18);ctx.fillStyle='rgba(138,180,255,.22)';ctx.strokeStyle='#8ab4ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,S*.028*(1+.08*Math.sin(clk*5)),0,7);ctx.fill();ctx.stroke();noglow();ctx.fillStyle='#d6e4ff';ctx.beginPath();ctx.arc(x,y,S*.008,0,7);ctx.fill()}
  else{const sz=1+(RM?0:.12*Math.sin(clk*6+e.a*3));glow('#8ffbe0',16);ctx.fillStyle='#8ffbe0';ctx.beginPath();
   for(let k=0;k<8;k++){const rr=(k%2?S*.009:S*.032)*sz,aa=k*Math.PI/4-Math.PI/2;ctx.lineTo(x+Math.cos(aa)*rr,y+Math.sin(aa)*rr)}ctx.closePath();ctx.fill();noglow()}
  ctx.globalAlpha=1}
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;ctx.globalAlpha=q.life/q.max;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*q.life/q.max,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 if(p){const[x,y]=pos(p.a,p.r);
  for(let k=1;k<=7;k++){const[tx,ty]=pos(p.a-k*.065,p.r);ctx.globalAlpha=.55-k*.07;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(tx,ty,S*.021*(1-k*.1),0,7);ctx.fill()}
  ctx.globalAlpha=1;glow('#ffd23f',22);ctx.fillStyle='#fff6c9';ctx.beginPath();ctx.arc(x,y,S*.022,0,7);ctx.fill();noglow();
  if(shield){glow('#8ab4ff',16);ctx.fillStyle='rgba(138,180,255,.16)';ctx.strokeStyle='#8ab4ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,S*.04,0,7);ctx.fill();ctx.stroke();noglow()}}
 ctx.restore();
}
reset();
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(running&&!paused)step(dt);draw(paused?0:dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
